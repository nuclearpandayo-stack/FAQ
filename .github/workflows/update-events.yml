name: Update Clan Events

on:

  # Lets us press "Run workflow" ourselves
  workflow_dispatch:

  # Automatically update every hour
  schedule:
    - cron: "35 * * * *"


permissions:
  contents: write


concurrency:

  group: dark-omen-events

  cancel-in-progress: true


jobs:

  update-events:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout website
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Pull events from Google Calendar

        env:

          DARK_OMEN_CALENDAR_URL: ${{ secrets.DARK_OMEN_CALENDAR_URL }}

        run: |
          python scripts/update_events.py


      - name: Commit updated events

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json

          if git diff --cached --quiet; then

            echo "No event changes."

            exit 0

          fi

          git commit \
          -m "Update clan events"

          git push